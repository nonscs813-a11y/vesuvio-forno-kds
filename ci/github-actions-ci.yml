name: Enterprise CI, Firebase TLS, OWASP & LGPD Audit (Vesuvio Forno & Brasa)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-privacy-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute 20 Enterprise Tests (Firebase TLS 1.3, OWASP Top 10, LGPD Privacy & Financial Math)
        run: npm test

      - name: Validate tenant isolation in Firestore rules
        run: |
          ! grep -q 'allow read: if true' firestore.rules
          grep -q "request.auth.token.site" firestore.rules
          grep -q "role == 'site_admin'" firestore.rules
          grep -q "match /audit_logs/{tenant}/events/{docId}" firestore.rules
